<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Mini ChatGPT</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #0f0f10;
    --surface: #1a1a1c;
    --surface-2: #232326;
    --surface-3: #2a2a2e;
    --border: #2e2e32;
    --text: #e8e8ea;
    --text-dim: #9a9aa0;
    --accent: #10a37f;
    --user-bubble: #2b2b30;
    --code-bg: #0a0a0b;
  }

  html,
  body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      'Segoe UI',
      Roboto,
      Helvetica,
      Arial,
      sans-serif;
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 14px;
    cursor: pointer;
  }

  .icon-btn:active {
    background: var(--surface-2);
  }

  #chatTitle {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 8px;
  }

  #historyPanel {
    display: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    max-height: 40vh;
    overflow-y: auto;
    flex-shrink: 0;
  }

  #historyPanel.open {
    display: block;
  }

  .history-item {
    padding: 12px 14px;
    font-size: 13px;
    border-bottom: 1px solid var(--surface-2);
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-item.active {
    background: var(--surface-2);
    color: var(--text);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 16px 12px 10px;
  }

  #emptyState {
    margin: auto;
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }

  .message-row {
    display: flex;
    flex-direction: column;
    max-width: 100%;
  }

  .message-row.user {
    align-items: flex-end;
  }

  .message-row.assistant {
    align-items: flex-start;
  }

  .bubble {
    max-width: 88%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.55;
    word-wrap: break-word;
  }

  .bubble.user {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }

  .bubble.assistant {
    background: var(--surface);
    border-bottom-left-radius: 4px;
    width: 100%;
  }

  .bubble.assistant h1,
  .bubble.assistant h2,
  .bubble.assistant h3 {
    margin: 14px 0 8px;
    line-height: 1.3;
    font-weight: 700;
  }

  .bubble.assistant h1:first-child,
  .bubble.assistant h2:first-child,
  .bubble.assistant h3:first-child {
    margin-top: 0;
  }

  .bubble.assistant h1 {
    font-size: 19px;
  }

  .bubble.assistant h2 {
    font-size: 17px;
  }

  .bubble.assistant h3 {
    font-size: 15.5px;
  }

  .bubble.assistant p {
    margin: 0 0 10px 0;
  }

  .bubble.assistant p:last-child {
    margin-bottom: 0;
  }

  .bubble.assistant strong {
    font-weight: 700;
  }

  .bubble.assistant em {
    font-style: italic;
  }

  .bubble.assistant ul,
  .bubble.assistant ol {
    margin: 0 0 10px 22px;
  }

  .bubble.assistant li {
    margin-bottom: 4px;
  }

  .bubble.assistant a {
    color: #6bc9f7;
    text-decoration: underline;
    word-break: break-all;
  }

  .bubble.assistant blockquote {
    border-left: 3px solid var(--border);
    padding-left: 10px;
    color: var(--text-dim);
    margin: 0 0 10px 0;
  }

  .bubble.assistant code {
    background: var(--surface-2);
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 13px;
    font-family:
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Consolas,
      monospace;
  }

  .code-block-wrapper {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 10px 0;
    overflow: hidden;
  }

  .code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: var(--surface-3);
    border-bottom: 1px solid var(--border);
  }

  .code-block-lang {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .code-copy-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 6px;
    cursor: pointer;
  }

  .code-copy-btn:active {
    background: var(--surface-2);
  }

  .code-block-wrapper pre {
    margin: 0;
    padding: 12px;
    overflow-x: auto;
  }

  .code-block-wrapper pre code {
    background: none;
    padding: 0;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre;
  }

  .response-copy-btn {
    margin-top: 6px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 7px;
    cursor: pointer;
    align-self: flex-start;
  }

  .response-copy-btn:active {
    background: var(--surface-2);
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--surface);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) {
    animation-delay: 0.2s;
  }

  .typing span:nth-child(3) {
    animation-delay: 0.4s;
  }

  @keyframes blink {
    0%,
    80%,
    100% {
      opacity: 0.3;
    }

    40% {
      opacity: 1;
    }
  }

  #errorBanner {
    display: none;
    background: #3a1e1e;
    color: #ff9b9b;
    font-size: 13px;
    padding: 8px 14px;
    text-align: center;
    flex-shrink: 0;
  }

  #inputBar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding:
      10px
      12px
      calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
  }

  #messageInput {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 14px;
    padding: 11px 14px;
    font-size: 15px;
    resize: none;
    max-height: 120px;
    font-family: inherit;
  }

  #messageInput:focus {
    outline: none;
    border-color: var(--accent);
  }

  #sendBtn {
    background: var(--accent);
    border: none;
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
  }

  #sendBtn:disabled {
    opacity: 0.4;
  }
</style>
</head>

<body>

<div id="app">

  <div id="topbar">
    <button class="icon-btn" id="historyBtn">☰</button>

    <div id="chatTitle">New Chat</div>

    <button class="icon-btn" id="newChatBtn">+ New</button>
  </div>

  <div id="historyPanel"></div>

  <div id="errorBanner"></div>

  <div id="messages">
    <div id="emptyState">
      Ask me anything to get started.
    </div>
  </div>

  <div id="inputBar">
    <textarea
      id="messageInput"
      rows="1"
      placeholder="Message Claude…"
    ></textarea>

    <button id="sendBtn">➤</button>
  </div>

</div>

<script>

const STORAGE_KEY = 'mini-chatgpt-conversations';

let conversations = [];
let activeId = null;
let loading = false;

const messagesEl =
  document.getElementById('messages');

const historyPanel =
  document.getElementById('historyPanel');

const chatTitle =
  document.getElementById('chatTitle');

const errorBanner =
  document.getElementById('errorBanner');

const input =
  document.getElementById('messageInput');

const sendBtn =
  document.getElementById('sendBtn');

const historyBtn =
  document.getElementById('historyBtn');

const newChatBtn =
  document.getElementById('newChatBtn');


function loadConversations() {
  try {
    const raw =
      localStorage.getItem(STORAGE_KEY);

    return raw ? JSON.parse(raw) : [];

  } catch {
    return [];
  }
}


function saveConversations() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(conversations)
    );
  } catch {}
}


function newConversation() {
  return {
    id: Date.now().toString(),
    title: 'New Chat',
    messages: []
  };
}


function getActive() {
  return conversations.find(
    c => c.id === activeId
  );
}


function renderMarkdown(text) {

  try {

    const rawHtml =
      marked.parse(text, {
        breaks: true,
        gfm: true
      });

    return DOMPurify.sanitize(rawHtml);

  } catch {

    const div =
      document.createElement('div');

    div.textContent = text;

    return div.innerHTML.replace(
      /\n/g,
      '<br>'
    );
  }
}


function enhanceCodeBlocks(container) {

  const pres =
    container.querySelectorAll('pre');

  pres.forEach(pre => {

    const codeEl =
      pre.querySelector('code');

    if (!codeEl) return;

    let lang = '';

    const classMatch =
      (codeEl.className || '')
        .match(/language-(\w+)/);

    if (classMatch) {
      lang = classMatch[1];
    }

    const wrapper =
      document.createElement('div');

    wrapper.className =
      'code-block-wrapper';

    const header =
      document.createElement('div');

    header.className =
      'code-block-header';

    const langLabel =
      document.createElement('span');

    langLabel.className =
      'code-block-lang';

    langLabel.textContent =
      lang || 'code';

    const copyBtn =
      document.createElement('button');

    copyBtn.className =
      'code-copy-btn';

    copyBtn.textContent =
      'Copy';

    copyBtn.onclick = () => {

      navigator.clipboard?.writeText(
        codeEl.textContent || ''
      );

      copyBtn.textContent =
        'Copied!';

      setTimeout(() => {
        copyBtn.textContent =
          'Copy';
      }, 1500);
    };

    header.appendChild(langLabel);
    header.appendChild(copyBtn);

    pre.parentNode.insertBefore(
      wrapper,
      pre
    );

    wrapper.appendChild(header);
    wrapper.appendChild(pre);
  });
}


function render() {

  const active = getActive();

  chatTitle.textContent =
    active ? active.title : 'Mini ChatGPT';

  messagesEl.innerHTML = '';

  if (
    !active ||
    active.messages.length === 0
  ) {

    const empty =
      document.createElement('div');

    empty.id =
      'emptyState';

    empty.textContent =
      'Ask me anything to get started.';

    messagesEl.appendChild(empty);

  } else {

    active.messages.forEach(m => {

      const row =
        document.createElement('div');

      row.className =
        'message-row ' +
        (m.role === 'user'
          ? 'user'
          : 'assistant');

      const bubble =
        document.createElement('div');

      bubble.className =
        'bubble ' +
        (m.role === 'user'
          ? 'user'
          : 'assistant');

      if (m.role === 'user') {

        bubble.textContent =
          m.content;

        row.appendChild(bubble);

      } else {

        bubble.innerHTML =
          renderMarkdown(m.content);

        enhanceCodeBlocks(bubble);

        row.appendChild(bubble);

        if (m.content) {

          const copyBtn =
            document.createElement('button');

          copyBtn.className =
            'response-copy-btn';

          copyBtn.textContent =
            'Copy response';

          copyBtn.onclick = () => {

            navigator.clipboard?.writeText(
              m.content
            );

            copyBtn.textContent =
              'Copied!';

            setTimeout(() => {
              copyBtn.textContent =
                'Copy response';
            }, 1500);
          };

          row.appendChild(copyBtn);
        }
      }

      messagesEl.appendChild(row);
    });
  }

  if (loading) {

    const typingRow =
      document.createElement('div');

    typingRow.className =
      'message-row assistant';

    const typing =
      document.createElement('div');

    typing.className =
      'typing';

    typing.innerHTML =
      '<span></span><span></span><span></span>';

    typingRow.appendChild(typing);

    messagesEl.appendChild(typingRow);
  }

  messagesEl.scrollTop =
    messagesEl.scrollHeight;

  historyPanel.innerHTML = '';

  conversations.forEach(c => {

    const item =
      document.createElement('div');

    item.className =
      'history-item' +
      (c.id === activeId
        ? ' active'
        : '');

    item.textContent =
      c.title;

    item.onclick = () => {

      activeId = c.id;

      historyPanel.classList.remove(
        'open'
      );

      hideError();

      render();
    };

    historyPanel.appendChild(item);
  });

  sendBtn.disabled =
    loading ||
    !input.value.trim();
}


function showError(msg) {

  errorBanner.textContent =
    msg;

  errorBanner.style.display =
    'block';
}


function hideError() {

  errorBanner.style.display =
    'none';
}


/*
  Reads Gemini's streaming SSE response
  and updates the assistant message
  as text arrives.
*/
async function readStream(
  response,
  active,
  assistantMessage
) {

  if (!response.body) {
    throw new Error(
      'No streaming response received.'
    );
  }

  const reader =
    response.body.getReader();

  const decoder =
    new TextDecoder();

  let buffer = '';

  while (true) {

    const { value, done } =
      await reader.read();

    if (done) break;

    buffer +=
      decoder.decode(
        value,
        { stream: true }
      );

    const events =
      buffer.split('\n\n');

    buffer =
      events.pop() || '';

    for (const event of events) {

      const lines =
        event.split('\n');

      for (const line of lines) {

        if (!line.startsWith('data:')) {
          continue;
        }

        const jsonText =
          line.slice(5).trim();

        if (!jsonText) continue;

        try {

          const data =
            JSON.parse(jsonText);

          if (data.error) {
            throw new Error(
              data.error
            );
          }

          if (data.text) {

            assistantMessage.content +=
              data.text;

            /*
              Update only the last
              assistant message while
              Gemini is generating.
            */
            updateStreamingMessage(
              assistantMessage.content
            );
          }

        } catch (err) {

          if (
            err.message &&
            err.message !==
              'Unexpected end of JSON input'
          ) {
            throw err;
          }
        }
      }
    }
  }
}


function updateStreamingMessage(text) {

  const rows =
    messagesEl.querySelectorAll(
      '.message-row.assistant'
    );

  if (!rows.length) return;

  const lastRow =
    rows[rows.length - 1];

  const bubble =
    lastRow.querySelector(
      '.bubble.assistant'
    );

  if (!bubble) return;

  bubble.innerHTML =
    renderMarkdown(text);

  enhanceCodeBlocks(bubble);

  messagesEl.scrollTop =
    messagesEl.scrollHeight;
}


async function sendMessage() {

  const text =
    input.value.trim();

  if (!text || loading) return;

  hideError();

  const active =
    getActive();

  const isFirst =
    active.messages.length === 0;

  active.messages.push({
    role: 'user',
    content: text
  });

  if (isFirst) {
    active.title =
      text.slice(0, 30);
  }

  /*
    Create the assistant message
    immediately so streaming text
    has somewhere to appear.
  */
  const assistantMessage = {
    role: 'assistant',
    content: ''
  };

  active.messages.push(
    assistantMessage
  );

  input.value = '';

  input.style.height =
    'auto';

  loading = true;

  render();

  saveConversations();

  try {

    const res =
      await fetch(
        '/api/chat',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({
            /*
              Don't send the empty
              assistant placeholder
              to Gemini.
            */
            messages:
              active.messages.filter(
                m =>
                  !(
                    m.role ===
                      'assistant' &&
                    m.content === ''
                  )
              )
          })
        }
      );

    if (!res.ok) {

      let errorMessage =
        'Request failed.';

      try {

        const data =
          await res.json();

        errorMessage =
          data.error ||
          errorMessage;

      } catch {}

      throw new Error(
        errorMessage
      );
    }

    await readStream(
      res,
      active,
      assistantMessage
    );

    if (!assistantMessage.content) {

      throw new Error(
        'Gemini returned an empty response.'
      );
    }

  } catch (err) {

    /*
      Remove empty assistant message
      if the request failed before
      any text arrived.
    */
    if (
      !assistantMessage.content
    ) {

      active.messages =
        active.messages.filter(
          m => m !== assistantMessage
        );
    }

    showError(
      err.message ||
        'Failed to reach Gemini.'
    );

  } finally {

    loading = false;

    saveConversations();

    render();
  }
}


newChatBtn.addEventListener(
  'click',
  () => {

    const c =
      newConversation();

    conversations.unshift(c);

    activeId =
      c.id;

    historyPanel.classList.remove(
      'open'
    );

    hideError();

    saveConversations();

    render();
  }
);


historyBtn.addEventListener(
  'click',
  () => {

    historyPanel.classList.toggle(
      'open'
    );
  }
);


sendBtn.addEventListener(
  'click',
  sendMessage
);


input.addEventListener(
  'input',
  () => {

    sendBtn.disabled =
      loading ||
      !input.value.trim();

    input.style.height =
      'auto';

    input.style.height =
      Math.min(
        input.scrollHeight,
        120
      ) + 'px';
  }
);


input.addEventListener(
  'keydown',
  e => {

    if (
      e.key === 'Enter' &&
      !e.shiftKey
    ) {

      e.preventDefault();

      sendMessage();
    }
  }
);


function init() {

  conversations =
    loadConversations();

  if (
    conversations.length === 0
  ) {

    const c =
      newConversation();

    conversations.push(c);
  }

  activeId =
    conversations[0].id;

  render();
}


init();

</script>

</body>
 </html>
